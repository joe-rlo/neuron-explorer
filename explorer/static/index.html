<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuron Explorer</title>
<link rel="stylesheet" href="style.css?v=68">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <nav id="views">
    <button data-view="map" class="on" title="the model as a stack of 32 layer sheets, one dot per neuron">map</button>
    <button data-view="embed" title="this layer's swept rollouts embedded in 2D, colored by neuron, prompt, dose or kind">embeddings</button>
  </nav>
  <select id="layer" aria-label="layer" title="layer · ● marks layers with sweep rollouts (examples, word mass and the ranked list); other layers have the lens and connections only"></select>
  <span class="seg" id="layout-mode"><button data-k="index" title="sheet layout: neurons in index order, N0 top left">index</button><button data-k="writes" class="on" title="sheet layout: neurons that write similar directions into the residual stream sit together">writes</button></span>
  <span class="seg" id="web-mode" title="connection web of the focused neuron: upstream and downstream cones; yellow links push the reader up, magenta push it down"><button data-w="off" title="hide the open neuron's connection web">no web</button><button data-w="on" class="on" title="show the open neuron's connection web: what feeds it (upstream) and what it feeds (downstream)">web</button></span><input id="web-z" value="5" inputmode="numeric" aria-label="web top links" title="web: the open neuron's top links each way">
  <input id="jump" placeholder="L22 N2742" aria-label="go to neuron" title="go to a neuron: type a layer and neuron, like L22 N2742, and press Enter" spellcheck="false">
  <span class="seg" id="q-mode"><button data-q="lens" class="on" title="lens: find neurons whose lens has a token containing your text, i.e. neurons that push the model toward or away from it">lens</button><button data-q="fires" title="fires: run your text through the model and list the neurons that fire most on it">fires</button></span>
  <input id="lens-q" placeholder="search lens" aria-label="search" spellcheck="false" autocomplete="off">
  <span id="status" class="mono"></span>
</header>

<main>
  <section id="map-view" class="view on">
    <canvas id="map"></canvas>
    <div id="layer-labels"></div>
    <button id="layer-back"></button>
  </section>
  <section id="embed-view" class="view">
    <canvas id="scatter"></canvas>
    <div id="embed-empty" class="slot"></div>
    <div id="embed-bar">
      <span class="seg" id="color-by">
        <button data-c="neuron" class="on">neuron</button><button data-c="prompt">prompt</button><button data-c="dose">dose</button><button data-c="kind">kind</button>
      </span>
    </div>
    <div id="tip" class="float"></div>
  </section>

  <aside id="list" class="float">
    <div id="focus-head">
      <div class="id-line"><span id="f-id" class="mono"></span><span id="f-rank" class="mono dim"></span><button id="f-close" aria-label="close neuron">×</button></div>
      <textarea id="f-name" rows="1" placeholder="name" spellcheck="false" aria-label="feature name"></textarea>
    </div>
    <nav id="ltabs"><button data-lt="net" class="on">net</button><button data-lt="run">run</button><button id="list-hide" class="edge" aria-label="hide list" title="hide the list panel">‹</button></nav>
    <div id="lt-net" class="lpane on">
      <div id="net"></div>
      <div id="list-head">
        <input id="filter" placeholder="filter" spellcheck="false" aria-label="filter by word or name">
        <label class="dim"><input type="checkbox" id="show-random"> random</label>
        <select id="sort" class="dim" aria-label="sort list" title="mass: how much the neuron's steered rollouts cluster on its top words, as a z-score against random controls · window: therapeutic index from dose sweeps with the chat's measure"><option value="mass">mass</option><option value="window">window</option></select>
      </div>
      <ol id="rows" class="rows"></ol>
    </div>
    <div id="lt-run" class="lpane">
      <textarea id="inf-text" rows="6" placeholder="paste text: see which neurons fire most on each token" spellcheck="false"></textarea>
      <div id="infer">
        <div id="inf-toks"></div>
        <div id="inf-filters">
          <span class="lab">L</span><input id="inf-lo" value="0" inputmode="numeric" aria-label="from layer"><span class="lab">–</span><input id="inf-hi" value="31" inputmode="numeric" aria-label="to layer">
          <span class="seg" id="inf-sign"><button data-s="both" class="on">±</button><button data-s="+">+</button><button data-s="-">−</button></span>
          <span class="lab">≥</span><input id="inf-min" value="1.0" inputmode="decimal" aria-label="minimum score">
          <input id="inf-q" placeholder="lens has…" aria-label="lens filter" spellcheck="false">
        </div>
      </div>
      <ol id="run-rows" class="rows"></ol>
    </div>
  </aside>

  <button id="list-tab" class="tab-edge left" aria-label="show list" title="show the list panel">›</button>
  <button id="focus-tab" class="tab-edge right mono" aria-label="show neuron"></button>
  <aside id="focus" class="float">
    <nav id="tabs"><button data-tab="examples" class="on">Examples</button><button data-tab="chat">Chat</button><button data-tab="details">Details</button><button data-tab="claude">Claude</button><select id="a-agent" class="mono dim" title="agent for new conversations"><option value="claude">claude</option><option value="codex">codex</option></select><button id="a-past" class="mono dim" title="past conversations">past</button><button id="a-new" class="mono dim" title="start a new conversation">new</button><button id="f-collapse" class="edge" aria-label="collapse">›</button></nav>
    <div id="tab-examples" class="tab on"></div>
    <div id="tab-chat" class="tab">
      <div id="c-lens"></div>
      <div id="c-thread"></div>
      <div id="c-reads"></div>
      <form id="c-form">
        <div id="chat-controls">
          <span class="xk">steer</span>
          <span class="seg" id="c-mode"><button type="button" data-m="add" class="on" title="add: push along the neuron's output direction by dose × a typical residual size (▲ +dose, ▼ −dose)">add</button><button type="button" data-m="mul" title="×: multiply the neuron's activation by the dose (▲ ×dose, ▼ ×−dose); ×1 leaves it alone">×</button></span>
          <span class="seg" id="c-dir"><button type="button" data-d="writes" class="on" title="writes: steer the model with this neuron and compare its replies">writes</button><button type="button" data-d="reads" title="reads you: color each token of your text by how strongly this neuron fires on it">reads you</button></span>
          <span class="stepper" title="dose: the ▲ column is pushed by +dose, the ▼ column by −dose, the middle column is unsteered"><button type="button" id="c-minus" aria-label="smaller dose">−</button><input id="c-dose" class="mono" inputmode="decimal" aria-label="dose" value="0.8"><button type="button" id="c-plus" aria-label="larger dose">+</button></span>
          <button type="button" id="c-clear" class="dim" title="clear the conversation (and cancel a running sweep)">clear</button>
        </div>
        <div id="x-controls">
          <span class="xk">measure</span>
          <select id="x-measure" aria-label="outcome measure" title="what to count in every reply; coherence (how natural the text is to the unsteered model) is always scored too"></select><button type="button" id="x-edit" class="dim" title="edit or add measures">edit</button>
          <label class="xf" title="replies per column; reply i uses the same seed in every column, so the columns compare reply by reply">samples<input id="x-n" class="mono" inputmode="numeric" value="8" aria-label="samples per column"></label>
          <button type="button" id="x-more-btn" class="dim" aria-expanded="false" title="temperature, reply length and seed">settings</button>
          <span class="xgap"></span>
          <button type="button" id="x-sweep" title="run this prompt at doses −1 to +1 and plot the measure and coherence against dose">dose sweep</button><button type="button" id="x-quick" class="dim" title="a fast sweep: doses −0.5, 0, +0.5 with 4 short replies each">quick sweep</button>
        </div>
        <div id="x-more" hidden>
          <label class="xf" title="sampling temperature; 0 is greedy, so every sample would be identical">temperature<input id="x-temp" class="mono" inputmode="decimal" value="0.7" aria-label="temperature"></label>
          <label class="xf" title="maximum new tokens per reply">max tokens<input id="x-max" class="mono" inputmode="numeric" value="200" aria-label="max new tokens"></label>
          <label class="xf" title="reply i uses seed + i; the same seed gives the same replies">seed<input id="x-seed" class="mono" inputmode="numeric" value="0" aria-label="base seed"></label>
        </div>
        <div id="x-editor" hidden></div>
        <div class="row"><input id="c-input" placeholder="Who are you?" autocomplete="off"><button id="c-go" type="submit">run</button></div>
      </form>
    </div>
    <div id="tab-details" class="tab"></div>
    <div id="tab-claude" class="tab">
      <div id="a-thread"><div class="a-empty dim">Ask anything about the model, or open a neuron and press <b>explain</b>.</div></div>
      <div id="a-actions"></div>
      <div id="a-files"></div>
      <form id="a-form"><button id="a-attach" type="button" title="attach files (or drop / paste them)" aria-label="attach">📎</button><input id="a-file" type="file" multiple hidden><textarea id="a-input" rows="1" placeholder="Ask Claude…" title="while Claude works: Enter interrupts and sends, ⌘/Ctrl+Enter queues" spellcheck="false"></textarea><button id="a-send" type="submit" aria-label="send">↑</button></form>
    </div>
  </aside>
</main>
<script type="module" src="app.js?v=130"></script>
</body>
</html>
